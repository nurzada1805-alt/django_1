# Для разработки: база и Redis в Docker, Django — у тебя через runserver.
# docker compose -f compose.dev.yaml up -d
name: notes-dev
services:
db:
image: postgres:16-alpine
env_file: .env
ports:
- "127.0.0.1:5432:5432"
volumes:
- pgdata_dev:/var/lib/postgresql/data
redis:
image: redis:7-alpine
ports:
- "127.0.0.1:6379:6379"
volumes:
pgdata_dev: