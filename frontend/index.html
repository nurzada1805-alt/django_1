<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Мои заметки</title>
<h1>Мои заметки</h1>
<form id="login">
  <input name="username" placeholder="Логин" value="masha">
  <input name="password" type="password" placeholder="Пароль" value="StrongPass123">
  <button>Войти</button>
</form>
<form id="create" hidden>
  <input name="title" placeholder="Новая заметка">
  <button>Добавить</button>
</form>
<p id="status"></p>
<ul id="notes"></ul>
<script>
const API = 'http://localhost:8000/api';
const statusEl = document.getElementById('status');
let accessToken = null;
 
async function loadNotes() {
  const response = await fetch(`${API}/notes/`, {
    headers: {'Authorization': `Bearer ${accessToken}`},
  });
  const data = await response.json();
  const list = document.getElementById('notes');
  list.replaceChildren(...data.results.map(note => {
    const item = document.createElement('li');
    item.textContent = `${note.title} — ${note.status}`;
    return item;
  }));
  statusEl.textContent = `Заметок всего: ${data.count}`;
}
 
document.getElementById('create').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  const response = await fetch(`${API}/notes/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${accessToken}`,
    },
    body: JSON.stringify({title: form.get('title')}),
  });
  if (!response.ok) {
    const errors = await response.json();
    statusEl.textContent = `Ошибка: ${JSON.stringify(errors)}`;
    return;
  }
  event.target.reset();
  await loadNotes();
});
 
document.getElementById('login').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  try {
    const tokenResponse = await fetch(`${API}/auth/token/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.fromEntries(form)),
    });
    const tokens = await tokenResponse.json();
    if (!tokenResponse.ok) throw new Error(tokens.detail);
 
    accessToken = tokens.access;
    document.getElementById('create').hidden = false;
    await loadNotes();
  } catch (error) {
    statusEl.textContent = `Ошибка: ${error.message}`;
  }
});
</script>
</html>
