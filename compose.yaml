services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: notes-web:${TAG:-latest}  # у каждой сборки — своя метка
    env_file: .env
    environment:
      # Внутри сети compose хосты называются по именам сервисов
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CACHE_URL: redis://redis:6379/1
      NUM_PROXIES: 1
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # После получения сертификата (часть 35.3):
      # - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro   # папку, а не файл: правки видны без пересоздания
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      # Файлы проверки Let's Encrypt и сертификаты (часть 35.3):
      # - ./certbot/www:/var/www/certbot:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  static:
  media:
