# Не больше 10 попыток входа в минуту с одного IP — ещё до Django
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;                  # не показывать версию nginx

    client_max_body_size 3m;            # чуть больше лимита вложений в 2 МБ

    gzip on;
    gzip_types application/json application/vnd.oai.openapi text/css application/javascript;
    gzip_min_length 1000;

    # Заголовки для Django — общие для всех location с proxy_pass
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Проверка домена для Let's Encrypt (часть 35.3)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/media/;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://django;
    }

    location / {
        proxy_pass http://django;
    }
}
